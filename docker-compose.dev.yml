services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: scout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
      POSTGRES_DB: scout_db
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scout -d scout_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: